<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    /* html/body stay unstyled and margin-free. A background on <body> propagates to the
       whole popup canvas, which hides the rounded corners, so the box lives on .popup. */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .popup {
      box-sizing: border-box;
      width: 260px;
      padding: 16px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #e7e5e4;
      border: #590016 2px solid;
      border-radius: 12px;
    }

    h1 {
      font-size: 15px;
      margin: 0 0 12px 0;
      color:#590016
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .field-label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 60px;
      font-family: inherit;
      font-size: 12px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
      margin-bottom: 4px;
    }
    #avatar-name {
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 13px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    #avatar-name-count {
      color: #888;
      font-size: 11px;
      text-align: right;
      margin: 2px 0 12px 0;
    }
    .hint {
      color: #888;
      font-size: 11px;
      margin: 0 0 12px 0;
    }
    button {
      width: 100%;
      padding: 7px 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    #save-settings {
      background: #D8B45B;
      color: white;
    }
    #reset-btn {
      background: #fee2e2;
      color: #b91c1c;
    }
    #status {
      font-size: 11px;
      color: #228B22;
      min-height: 14px;
      text-align: center;
    }
    hr {
      border: none;
      border-top: 2px solid #590016;
      margin: 14px 0;
    }
  </style>
</head>
<body>
<div class="popup">
  <h1>StudBud Settings</h1>

  <span class="field-label">Buddy name</span>
  <input type="text" id="avatar-name" maxlength="16" />
  <div id="avatar-name-count"></div>

  <label>
    <input type="checkbox" id="hide-avatar" />
    Hide avatar (keep task widget only)
  </label>

  <span class="field-label">Don't show on these sites</span>
  <textarea id="excluded-sites" placeholder="one site per line, e.g.&#10;mail.google.com&#10;canvas.instructure.com"></textarea>
  <p class="hint">One domain per line. Applies on next page load.</p>

  <button id="save-settings">Save settings</button>

  <hr />

  <button id="reset-btn">Reset all progress</button>
  <p class="hint">Clears XP, evolution, and current task. Cannot be undone. Changes take effect after page reload.</p>

  <div id="status"></div>

  <script src="popup.js"></script>
</div>
</body>
</html>
