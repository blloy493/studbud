<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      padding: 16px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px 0;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .field-label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 60px;
      font-family: inherit;
      font-size: 12px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
      margin-bottom: 4px;
    }
    .hint {
      color: #888;
      font-size: 11px;
      margin: 0 0 12px 0;
    }
    button {
      width: 100%;
      padding: 7px 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    #save-settings {
      background: #4f46e5;
      color: white;
    }
    #reset-btn {
      background: #fee2e2;
      color: #b91c1c;
    }
    #status {
      font-size: 11px;
      color: #16a34a;
      min-height: 14px;
      text-align: center;
    }
    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 14px 0;
    }
  </style>
</head>
<body>
  <h1>StudBud Settings</h1>

  <label>
    <input type="checkbox" id="hide-avatar" />
    Hide avatar (keep task widget only)
  </label>

  <span class="field-label">Don't show on these sites</span>
  <textarea id="excluded-sites" placeholder="one domain per line, e.g.&#10;mail.google.com&#10;canvas.instructure.com"></textarea>
  <p class="hint">One domain per line. Applies on next page load.</p>

  <button id="save-settings">Save settings</button>

  <hr />

  <button id="reset-btn">Reset all progress</button>
  <p class="hint">Clears XP, evolution, and current task. Cannot be undone.</p>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
